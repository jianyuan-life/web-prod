<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 鑒源 Logo Icon — 人臉側影迎旭日（看清本質、迎向光明） -->
  <defs>
    <clipPath id="circClip"><circle cx="32" cy="32" r="27"/></clipPath>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c87a"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>

  <!-- 圓底（深藍夜） -->
  <circle cx="32" cy="32" r="27" fill="#0f1628"/>

  <g clip-path="url(#circClip)">
    <!-- 旭日（右下升起、金漸層） -->
    <circle cx="46" cy="40" r="15" fill="url(#sunGrad)"/>
    <!-- 太陽光芒（向右上放射） -->
    <g stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round" opacity="0.85">
      <line x1="46" y1="20" x2="46" y2="13"/>
      <line x1="56" y1="24" x2="60" y2="19"/>
      <line x1="61" y1="34" x2="67" y2="33"/>
      <line x1="51" y1="21" x2="53" y2="16"/>
    </g>

    <!-- 人臉側影（深色剪影、面向右側旭日；曲線精修版） -->
    <path d="M 29 6
             C 19 7, 14 17, 14 30
             C 14 44, 20 55, 27 61
             L 34 61
             C 31 53, 32 47, 35 44
             C 37.5 42, 35.5 39.5, 33.5 38
             C 38 35.5, 39.5 31.5, 35 29.5
             C 40 26.5, 38.5 14, 29 6 Z"
          fill="#0f1628"/>
  </g>

  <!-- 圓框（金邊） -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.9"/>
</svg>
